services:
  loomi:
    build: .
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      Security__AccessKey: ${LOOMI_ACCESS_KEY:?Set LOOMI_ACCESS_KEY in .env}
      AllowedHosts: ${LOOMI_HOSTS:-localhost;127.0.0.1}
      Security__KnownProxies__0: ${LOOMI_PROXY_IP:-172.17.0.1}
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Root: /data
    volumes:
      - database:/data
      - browser-profiles:/data/profiles
      - images:/data/images
    stop_grace_period: 30s
volumes:
  database:
  browser-profiles:
  images:
