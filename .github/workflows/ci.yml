name: Verify Loomi
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Loomi/Client/package-lock.json
      - run: npm ci --prefix src/Loomi/Client
      - run: npm run build --prefix src/Loomi/Client
      - run: dotnet restore --configfile NuGet.Config
      - run: dotnet build --no-restore
      # Everything below this line that reads the build with --no-build must stay right after the build
      # step, before anything else runs. dotnet-ef trusts whatever assembly is already on disk; a check
      # that runs after a later rebuild, or after a step that edits source, would silently report the old
      # model instead of today's (the project has hit this class of stale-assembly trap before).
      - run: dotnet tool restore --configfile NuGet.Config
      - run: dotnet ef migrations has-pending-model-changes --project src/Loomi --no-build
      - run: pwsh src/Loomi/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-build
      - run: docker build -t loomi:ci .
      - name: Boot the built image and probe /health and noVNC
        # A build that succeeds proves nothing about a container that actually starts: this project once
        # shipped a Dockerfile that built cleanly but served 502 on /desktop/ at runtime. Start the real
        # image, hit /health from inside the container, and confirm websockify (noVNC, port 6080) is
        # listening. Everything is time-boxed so a hung container fails the job instead of hanging it.
        #
        # Development here is deliberate and only relaxes two things (see Program.cs): the session cookie
        # drops its Secure flag so plain-HTTP curl can send it back, and the OpenAPI document stops being
        # owner-only. Login still needs the real access key below; nothing about auth itself is weakened.
        run: |
          set -uo pipefail
          ACCESS_KEY="$(openssl rand -hex 32)"
          docker run -d --name loomi-ci --shm-size=1gb \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Security__AccessKey="$ACCESS_KEY" \
            -e AllowedHosts="localhost;127.0.0.1" \
            loomi:ci
          trap 'docker rm -f loomi-ci >/dev/null 2>&1 || true' EXIT

          healthy=
          for i in $(seq 1 30); do
            if docker exec loomi-ci curl -fsS --max-time 3 http://127.0.0.1:8080/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ -z "$healthy" ]; then
            echo "::error::/health never answered inside the container after 60s"
            docker logs loomi-ci
            exit 1
          fi

          # Any HTTP response (even a 404) proves websockify is listening; -f would wrongly fail on a
          # non-2xx body, so it is deliberately left off here.
          if ! docker exec loomi-ci curl -sS -o /dev/null --max-time 3 http://127.0.0.1:6080/; then
            echo "::error::noVNC (port 6080) is not listening inside the container"
            docker logs loomi-ci
            exit 1
          fi

          echo "Container answered /health and noVNC (6080) is listening."

          # /health and noVNC only prove the HTTP process and websockify are up. Neither one ever asks
          # Chromium to actually launch on the container's Xvfb display as the non-root "app" user, and
          # that launch is exactly the thing most likely to break in a container that builds cleanly
          # (missing libs, a sandbox that user namespaces refuse, a display that never comes up). The only
          # honest proof is the app's own path: sign in as the owner, create a ChatGPT account, and ask it
          # to connect. python3 and curl are already in the runtime image (websockify depends on the
          # former), so no extra tooling is installed just for this check.
          if ! timeout 220 docker exec -i loomi-ci bash -s -- "$ACCESS_KEY" <<'BROWSERCHECK'
          set -euo pipefail
          KEY="$1"
          BASE="http://127.0.0.1:8080"
          JAR="$(mktemp)"
          field() { python3 -c "import json,sys; print(json.load(sys.stdin)['$1'])"; }

          csrf=$(curl -fsS -c "$JAR" -b "$JAR" "$BASE/api/session" | field csrfToken)
          curl -fsS -c "$JAR" -b "$JAR" -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $csrf" \
            -d "{\"username\":\"owner\",\"password\":\"$KEY\"}" "$BASE/api/session/login" >/dev/null

          # A token minted before sign-in does not necessarily survive it; every test in this repo that
          # signs in re-reads the token afterward instead of assuming the first one still validates.
          csrf=$(curl -fsS -c "$JAR" -b "$JAR" "$BASE/api/session" | field csrfToken)

          account_id=$(curl -fsS -c "$JAR" -b "$JAR" -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $csrf" \
            -d '{"label":"ci-browser-check"}' "$BASE/api/auth/accounts" | field id)
          echo "Created ChatGPT account $account_id; connecting it (this launches Chromium)..."

          # Not -f here: a failure response is exactly what we need to see, not swallow.
          response=$(curl -sS --max-time 200 -w '\n%{http_code}' -c "$JAR" -b "$JAR" \
            -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $csrf" \
            -X POST "$BASE/api/auth/accounts/$account_id/connect")
          code=$(echo "$response" | tail -n1)
          payload=$(echo "$response" | sed '$d')
          echo "connect -> HTTP $code: $payload"
          if [ "$code" != "200" ]; then
            echo "the connect call itself failed, before any state was even reported" >&2
            exit 1
          fi

          state=$(echo "$payload" | field state)
          echo "Browser state after connect: $state"
          # LoginRequired, VerificationRequired (a Cloudflare challenge) and Connected all require a real
          # Chromium that navigated to chatgpt.com; Disconnected or anything else means the browser never
          # actually came up on this container's display.
          case "$state" in
            LoginRequired|VerificationRequired|Connected) exit 0 ;;
            *) echo "state '$state' does not prove a browser actually launched" >&2; exit 1 ;;
          esac
          BROWSERCHECK
          then
            echo "::error::The app could not launch a real Chromium session inside the container"
            docker logs loomi-ci
            exit 1
          fi

          echo "Container answered /health, noVNC (6080) is listening, and connecting an account launched a real Chromium session."
